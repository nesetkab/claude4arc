<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Modal scroll</title><style>body{margin:0;font:16px system-ui}.back{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}[role=dialog]{background:#fff;width:380px;padding:16px}.body{max-height:180px;overflow:auto;border:1px solid #ddd}.spacer{height:500px}#result{position:fixed;bottom:0;right:0;margin:0}</style></head><body>
<div class="back"><div role="dialog" aria-label="Settings"><div class="body"><p>Top</p><div class="spacer"></div><label><input type="checkbox" id="agree"> Share usage data</label></div><button id="save">Save</button></div></div>
<pre id="result">none</pre><script>document.getElementById("save").onclick=()=>{document.getElementById("result").textContent=document.getElementById("agree").checked?"checked":"unchecked"}</script></body></html>

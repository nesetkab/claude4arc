<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Disabled until checked</title></head>
<body>
<main>
<h1>Terms</h1>
<label><input type="checkbox" id="agree"> I agree to the terms</label>
<button type="button" id="submit" disabled>Continue</button>
<pre id="result">none</pre>
</main>
<script>
  const agree = document.getElementById("agree");
  const submit = document.getElementById("submit");
  agree.addEventListener("change", () => { submit.disabled = !agree.checked; });
  submit.addEventListener("click", () => { document.getElementById("result").textContent = "submitted"; });
</script>
</body>
</html>

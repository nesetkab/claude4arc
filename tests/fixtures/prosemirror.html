<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProseMirror</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prosemirror-view@1.42.6/style/prosemirror.css">
<style>#editor { width: 560px; min-height: 140px; border: 1px solid #999; padding: 8px; } .ProseMirror { min-height: 120px; outline: none; } .ProseMirror p { margin: 0 0 6px; }</style>
<script type="importmap">
{
  "imports": {
    "orderedmap": "https://cdn.jsdelivr.net/npm/orderedmap@2.1.1/dist/index.js",
    "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2.2.8/index.js",
    "rope-sequence": "https://cdn.jsdelivr.net/npm/rope-sequence@1.3.4/dist/index.js",
    "prosemirror-model": "https://cdn.jsdelivr.net/npm/prosemirror-model@1.25.12/dist/index.js",
    "prosemirror-transform": "https://cdn.jsdelivr.net/npm/prosemirror-transform@1.12.2/dist/index.js",
    "prosemirror-state": "https://cdn.jsdelivr.net/npm/prosemirror-state@1.4.4/dist/index.js",
    "prosemirror-view": "https://cdn.jsdelivr.net/npm/prosemirror-view@1.42.6/dist/index.js",
    "prosemirror-keymap": "https://cdn.jsdelivr.net/npm/prosemirror-keymap@1.2.3/dist/index.js",
    "prosemirror-commands": "https://cdn.jsdelivr.net/npm/prosemirror-commands@1.7.2/dist/index.js",
    "prosemirror-history": "https://cdn.jsdelivr.net/npm/prosemirror-history@1.5.1/dist/index.js",
    "prosemirror-schema-basic": "https://cdn.jsdelivr.net/npm/prosemirror-schema-basic@1.2.5/dist/index.js"
  }
}
</script>
</head>
<body>
<main>
<h1>ProseMirror editor</h1>
<div id="editor"></div>
<pre id="result">loading</pre>
</main>
<script type="module">
  import { EditorState } from "prosemirror-state";
  import { EditorView } from "prosemirror-view";
  import { DOMParser } from "prosemirror-model";
  import { schema } from "prosemirror-schema-basic";
  import { keymap } from "prosemirror-keymap";
  import { baseKeymap } from "prosemirror-commands";
  import { history, undo, redo } from "prosemirror-history";
  const log = { changes: 0, keys: 0, untrusted: 0 };
  document.addEventListener("keydown", (event) => {
    log.keys += 1;
    if (!event.isTrusted) log.untrusted += 1;
  }, true);
  const initial = document.createElement("div");
  initial.innerHTML = "<p>Old <strong>draft</strong></p>";
  const view = new EditorView(document.getElementById("editor"), {
    state: EditorState.create({
      doc: DOMParser.fromSchema(schema).parse(initial),
      plugins: [history(), keymap({ "Mod-z": undo, "Mod-Shift-z": redo }), keymap(baseKeymap)],
    }),
    dispatchTransaction(transaction) {
      if (transaction.docChanged) log.changes += 1;
      view.updateState(view.state.apply(transaction));
    },
  });
  const value = () => {
    const blocks = [];
    view.state.doc.forEach((node) => blocks.push(node.textContent));
    return blocks.join("\n");
  };
  if (new URLSearchParams(location.search).has("global")) window.view = view;
  window.probe = () => ({ value: value(), ...log });
  document.getElementById("result").textContent = "";
  document.body.dataset.ready = "1";
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
<main>
<h1>Dialogs</h1>
<button type="button" id="alert" onclick="alert('Saved!'); document.getElementById('result').textContent = 'alert:closed'">Show alert</button>
<button type="button" id="confirm" onclick="document.getElementById('result').textContent = 'confirm:' + confirm('Delete the item?')">Delete item</button>
<button type="button" id="prompt" onclick="document.getElementById('result').textContent = 'prompt:' + prompt('Your name?', 'guest')">Ask name</button>
<pre id="result">none</pre>
</main>
</body>
</html>

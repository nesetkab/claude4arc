<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pager trap</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 24px; }
  .slides { overflow: hidden; width: 300px; height: 40px; border: 1px solid #ccc; }
</style>
</head>
<body>
<div class="homepage">
  <div class="page-content">
    <div class="carousel">
      <div class="slides" id="slide">Slide 1</div>
      <button id="carousel-next">Next</button>
    </div>
    <form class="signup">
      <p>Step <span id="step">1</span> of 3</p>
      <button type="button" id="wizard-next">Next</button>
    </form>
    <h2>Invoices</h2>
    <ul id="list"></ul>
    <div class="pager"><button id="prev">Previous</button> <span id="pos"></span> <button id="next">Next</button></div>
  </div>
</div>
<pre id="result">none</pre>
<script>
  let page = 0;
  const per = 5;
  const pages = 6;
  const clicks = { carousel: 0, wizard: 0 };
  const report = (extra) => {
    document.getElementById("result").textContent = JSON.stringify({ page: page + 1, ...clicks, ...extra });
  };
  const draw = () => {
    const list = document.getElementById("list");
    list.innerHTML = "";
    for (let i = page * per; i < page * per + per; i++) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.textContent = "Invoice " + (1000 + i);
      button.onclick = () => report({ picked: button.textContent });
      li.append(button);
      list.append(li);
    }
    document.getElementById("pos").textContent = "Page " + (page + 1) + " of " + pages;
    document.getElementById("prev").disabled = page === 0;
    document.getElementById("next").disabled = page === pages - 1;
    report();
  };
  document.getElementById("prev").onclick = () => { page--; draw(); };
  document.getElementById("next").onclick = () => { page++; draw(); };
  document.getElementById("carousel-next").onclick = () => {
    clicks.carousel++;
    document.getElementById("slide").textContent = "Slide " + (clicks.carousel % 3 + 1);
    report();
  };
  document.getElementById("wizard-next").onclick = () => {
    clicks.wizard++;
    document.getElementById("step").textContent = String(clicks.wizard % 3 + 1);
    report();
  };
  draw();
</script>
</body>
</html>

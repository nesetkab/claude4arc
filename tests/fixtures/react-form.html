<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>React form</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<main>
<h1>React controlled form</h1>
<div id="root"></div>
<pre id="result">pending</pre>
</main>
<script>
  const h = React.createElement;
  function App() {
    const [name, setName] = React.useState("");
    const [email, setEmail] = React.useState("");
    const [plan, setPlan] = React.useState("free");
    const [terms, setTerms] = React.useState(false);
    const [renders, setRenders] = React.useState(0);
    React.useEffect(() => {
      document.getElementById("result").textContent = JSON.stringify({ live: { name, email, plan, terms } });
    }, [name, email, plan, terms]);
    const submit = (event) => {
      event.preventDefault();
      document.getElementById("result").textContent = JSON.stringify({ submitted: { name, email, plan, terms } });
    };
    return h("form", { onSubmit: submit },
      h("label", null, "Full name ", h("input", { id: "name", name: "name", value: name, onChange: (e) => setName(e.target.value) })),
      h("br"),
      h("label", null, "Email ", h("input", { id: "email", type: "email", name: "email", value: email, onChange: (e) => setEmail(e.target.value) })),
      h("br"),
      h("label", null, "Plan ", h("select", { id: "plan", value: plan, onChange: (e) => setPlan(e.target.value) },
        h("option", { value: "free" }, "Free"), h("option", { value: "pro" }, "Pro"), h("option", { value: "team" }, "Team"))),
      h("br"),
      h("label", null, h("input", { id: "terms", type: "checkbox", checked: terms, onChange: (e) => setTerms(e.target.checked) }), " Accept terms"),
      h("br"),
      h("button", { type: "submit", disabled: !name || !email }, "Create account"));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>

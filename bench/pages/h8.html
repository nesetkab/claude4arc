<!doctype html><html lang="en"><head><meta charset="utf-8"><style>body{font:16px system-ui;margin:32px;max-width:760px}label{display:block;margin:10px 0}button{margin:6px 4px 6px 0}</style><script src="/record.js"></script><title>H8 Expenses</title><style>.pick{display:inline-block;border:1px dashed #888;padding:10px 14px;border-radius:6px;cursor:pointer}.pick input{display:none}</style></head><body><main><h1>Submit an expense</h1><label class="pick">Attach receipt<input type="file" id="file" accept=".txt,.pdf,.png,.jpg"></label><p id="chosen">No file chosen.</p><button id="submit">Submit expense</button><p id="err" role="alert"></p><p id="status" role="status"></p></main><script>
file.onchange=()=>{chosen.textContent=file.files[0]?file.files[0].name:"No file chosen."};
submit.onclick=async()=>{const f=file.files[0];if(!f){err.textContent="Attach a receipt first.";return}err.textContent="";record("h8",{name:f.name,size:f.size,text:(await f.text()).trim().slice(0,40)})};
</script></body></html>

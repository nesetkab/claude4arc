<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B5 Priorities</title><style>body{font:16px system-ui;margin:32px;max-width:720px}label{display:block;margin:10px 0}button{margin:6px 0}</style><script src="/record.js"></script></head><body><main><h1>Priorities</h1><p>Drag Date to the top of the list, then press Save.</p><ul id="l"><li draggable="true" style="padding:8px;border:1px solid #ccc;margin:4px;cursor:grab">Apple</li>
<li draggable="true" style="padding:8px;border:1px solid #ccc;margin:4px;cursor:grab">Banana</li>
<li draggable="true" style="padding:8px;border:1px solid #ccc;margin:4px;cursor:grab">Cherry</li>
<li draggable="true" style="padding:8px;border:1px solid #ccc;margin:4px;cursor:grab">Date</li></ul><button id="save">Save</button><script>let dragged;for(const li of document.querySelectorAll("li")){li.addEventListener("dragstart",(e)=>{dragged=li;e.dataTransfer.setData("text/plain",li.textContent);});li.addEventListener("dragover",(e)=>e.preventDefault());li.addEventListener("drop",(e)=>{e.preventDefault();if(dragged&&dragged!==li)li.before(dragged);});}document.getElementById("save").onclick=()=>record("b5",[...document.querySelectorAll("li")].map((li)=>li.textContent).join(","));</script><p id="status" role="status"></p></main></body></html>

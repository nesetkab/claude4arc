<!doctype html><html lang="en"><head><meta charset="utf-8"><style>body{font:16px system-ui;margin:32px;max-width:760px}label{display:block;margin:10px 0}button{margin:6px 4px 6px 0}</style><script src="/record.js"></script><title>H4 Supplies</title><style>table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}th button{font:inherit;background:none;border:0;cursor:pointer;padding:0}</style></head><body><main><h1>Office supplies</h1><table><thead><tr><th><button id="byName">Product</button></th><th><button id="byPrice">Price</button></th><th></th></tr></thead><tbody id="rows"></tbody></table><p id="status" role="status"></p></main><script>
const items=[["Stapler",12.5],["Desk lamp",34],["Notebook",4.75],["Whiteboard markers",8.2],["Sticky notes",3.1],["Paper clips",1.25],["Ballpoint pens",2.4],["Label maker",45],["Binder",6.6],["Scissors",5.95],["Tape dispenser",7.3],["Highlighters",3.85]];
let order=[...items];
function draw(){rows.innerHTML="";for(const [n,p] of order){const tr=document.createElement("tr");tr.innerHTML="<td>"+n+"</td><td>$"+p.toFixed(2)+"</td><td><button>Add to cart</button></td>";tr.querySelector("button").onclick=()=>record("h4",n);rows.append(tr)}}
byPrice.onclick=()=>{order.sort((a,b)=>a[1]-b[1]);draw()};byName.onclick=()=>{order.sort((a,b)=>a[0].localeCompare(b[0]));draw()};draw();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B4 Directory</title><style>body{font:16px system-ui;margin:32px;max-width:720px}label{display:block;margin:10px 0}button{margin:6px 0}</style><script src="/record.js"></script></head><body><main><h1>Directory</h1><div id="vp" style="height:360px;overflow:auto;border:1px solid #ccc;position:relative"><div id="spacer" style="height:32000px"></div></div><script>const vp=document.getElementById("vp"),sp=document.getElementById("spacer");function draw(){const s=Math.floor(vp.scrollTop/32);sp.innerHTML="";for(let i=s;i<Math.min(1000,s+14);i++){const b=document.createElement("button");b.textContent="Row "+i;b.style.cssText="position:absolute;left:8px;top:"+(i*32)+"px;height:28px";b.onclick=()=>record("b4",b.textContent);sp.appendChild(b);}}vp.addEventListener("scroll",draw);draw();</script><p id="status" role="status"></p></main></body></html>

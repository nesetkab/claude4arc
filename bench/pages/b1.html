<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B1 Form</title><style>body{font:16px system-ui;margin:32px;max-width:720px}label{display:block;margin:10px 0}button{margin:6px 0}</style><script src="/record.js"></script></head><body><main><h1>Create account</h1><form id="f"><label for="name">Full name</label><input id="name" name="name"><label for="email">Email</label><input id="email" name="email" type="email"><label for="country">Country</label><select id="country" name="country"><option value="">Choose…</option><option>Portugal</option><option>Spain</option><option>France</option></select><fieldset><legend>Plan</legend><label><input type="radio" name="plan" value="Free"> Free</label><label><input type="radio" name="plan" value="Pro"> Pro</label></fieldset><label><input type="checkbox" name="terms"> I accept the terms</label><button>Create account</button></form><script>document.getElementById("f").addEventListener("submit",(e)=>{e.preventDefault();const d=new FormData(e.target);record("b1",{name:d.get("name"),email:d.get("email"),country:d.get("country"),plan:d.get("plan"),terms:d.get("terms")==="on"});});</script><p id="status" role="status"></p></main></body></html>
